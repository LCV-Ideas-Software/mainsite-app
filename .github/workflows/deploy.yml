# This workflow is managed by gh actions-lock.

name: Deploy

on:
  push:
    branches:
      - main

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--no-deprecation"

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy applications
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    permissions:
      contents: read # Read the exact source revision being deployed.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      - name: Install root validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate public assets and legal inventory
        run: npm run format:public:check

      - name: Install Worker dependencies
        working-directory: mainsite-worker
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Worker
        working-directory: mainsite-worker
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run biome
          npm test

      - name: Install frontend dependencies
        working-directory: mainsite-frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate frontend
        working-directory: mainsite-frontend
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run biome
          npm test
          npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAC11tvghUM34XXGV

      - name: Deploy Worker with Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          workingDirectory: mainsite-worker
          wranglerVersion: "4.123.0"
          command: deploy --strict

      - name: Deploy frontend with Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          workingDirectory: mainsite-frontend
          wranglerVersion: "4.123.0"
          command: pages deploy dist --project-name=mainsite-frontend --branch=main --commit-dirty=true
