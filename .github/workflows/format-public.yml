name: Public Format

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions: {}

concurrency:
  group: public-format-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prettier-public:
    name: Check index.html formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mainsite-worker/package-lock.json
            mainsite-frontend/package-lock.json

      - name: Install public-page dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check public page formatting
        run: npm run format:public:check

      - name: Install Worker dependencies
        working-directory: mainsite-worker
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Worker
        working-directory: mainsite-worker
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run biome
          npm test

      - name: Install frontend dependencies
        working-directory: mainsite-frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate frontend
        working-directory: mainsite-frontend
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run biome
          npm test
          npm run build
